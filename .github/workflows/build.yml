name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # The screen tests open real windows and press real buttons, so the runner needs
      # a display. Without one they skip themselves rather than fail, which would let
      # a broken screen through unnoticed -- hence the virtual framebuffer.
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build and test
        run: xvfb-run -a --server-args="-screen 0 1600x1200x24" mvn -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
